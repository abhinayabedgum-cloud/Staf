# Application Configuration - H2 Demo Mode
spring.application.name=talent-allocation
spring.datasource.url=jdbc:h2:mem:talentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.port=8080
app.capacity.max-allocation-percent=100
logging.level.com.talentallocation=INFO