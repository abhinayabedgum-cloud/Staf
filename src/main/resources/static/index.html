<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillMatch — Resource Allocation &amp; Staffing Marketplace</title>
    <meta name="description" content="AI-powered talent and resource allocation platform that matches employees to project demands using skills, availability, and location.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=20261019_v28">
</head>
<body>
    <!-- SIDEBAR NAV -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <span class="logo-text">SkillMatch</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
        </div>
        <ul class="nav-links">
            <li id="nav-item-demands"><a href="#" class="nav-link" data-page="demands" id="nav-demands">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>
                <span class="nav-label">Demand Intake</span>
            </a></li>
            <li id="nav-item-skills"><a href="#" class="nav-link" data-page="skills" id="nav-skills">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
                <span class="nav-label">Skill matrix</span>
            </a></li>
            <li id="nav-item-search"><a href="#" class="nav-link" data-page="search" id="nav-search">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
                <span class="nav-label">Resource Search</span>
            </a></li>
            <li id="nav-item-compare"><a href="#" class="nav-link" data-page="compare" id="nav-compare">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></span>
                <span class="nav-label">Candidate Comparison</span>
            </a></li>
            <li id="nav-item-allocations"><a href="#" class="nav-link" data-page="allocations" id="nav-allocations">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
                <span class="nav-label">Allocation Approval</span>
            </a></li>
            <li id="nav-item-dashboard"><a href="#" class="nav-link" data-page="dashboard" id="nav-dashboard">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></span>
                <span class="nav-label">Utilization Dashboard</span>
            </a></li>
            <li id="nav-item-ai"><a href="#" class="nav-link" data-page="ai" id="nav-ai">
                <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></span>
                <span class="nav-label">AI Assistant</span>
            </a></li>
        </ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="main-content" id="mainContent">
        <!-- TOP BAR -->
        <header class="topbar">
            <div class="topbar-left">
                <div class="topbar-context" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary)">
                    <span style="font-weight:600">SkillMatch</span>
                    <span style="color:var(--border-color);font-size:12px">/</span>
                    <span style="font-weight:700;color:var(--text-primary)">Enterprise Platform</span>
                </div>
            </div>
            <div class="topbar-right">
                <div class="search-bar" id="globalSearchBar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" placeholder="Quick search employees, demands, skills..." id="globalSearch" autocomplete="off">
                    <button id="searchClearBtn" style="display:none;background:none;border:none;color:var(--text-muted);cursor:pointer;padding:0 4px;font-size:16px;line-height:1" title="Clear search">&times;</button>
                    <div id="searchResultsDropdown" class="search-results-dropdown" style="display:none"></div>
                </div>
                <div class="notification-container" id="notificationContainer">
                    <div class="notification-bell" id="notificationBell" title="System Notifications">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-dot" id="notifBadge"></span>
                    </div>
                    <div id="notificationsDropdown" class="notifications-dropdown" style="display:none"></div>
                </div>
                <div class="user-session-container" id="userSessionContainer"></div>
            </div>
        </header>

        <!-- PAGE CONTENT -->
        <div class="page-content" id="pageContent">
            <!-- Pages are injected by JavaScript -->
        </div>
    </main>

    <!-- MODAL OVERLAY -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Modal</h2>
                <button class="modal-close" id="modalClose">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="app.js?v=20261019_v30"></script>
</body>
</html>
